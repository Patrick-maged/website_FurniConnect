<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FurniConnect - Create Account</title>
    <link rel="stylesheet" href="stylesheet2.css">
</head>
<body>
    <div class="container">
        <!-- Left Section: Image with Logo -->
        <div class="left-section">
            <img src="image.jpeg" height="740" width="750">
            <div class="logo">
                <h1><a href="Untitled-1.html">FurniConnect</a></h1>
            </div>
        </div>

        <!-- Right Section: Create Account Form -->
        <div class="right-section">
            <div class="form-content">
                <h1>Create your account</h1>
                <p>Join the first furniture design industry platform</p>
                <form>
                    <div class="input-group">
                        <input type="text" placeholder="First Name" required>
                        <span class="clear-icon">✕</span>
                    </div>
                    <div class="input-group">
                        <input type="text" placeholder="Last Name" required>
                        <span class="clear-icon">✕</span>
                    </div>
                    <div class="input-group">
                        <input type="email" placeholder="Email" required>
                        <span class="clear-icon">✕</span>
                    </div>
                    <div class="input-group">
                        <input type="password" placeholder="Password" required>
                        <span class="clear-icon">✕</span>
                    </div>
                    <div class="role-selection">
                        <label>Select your role</label>
                        <div class="roles">
                            <button type="button" class="role-btn designer">Designer</button>
                            <button type="button" class="role-btn educator">Educator</button>
                            <button type="button" class="role-btn supplier">Supplier</button>
                            <button type="button" class="role-btn producer">Producer</button>
                            <button type="button" class="role-btn retailer">Retailer</button>
                        </div>
                    </div>
                    <p class="guest-option">or continue as a guest</p>
                    <button type="button" class="guest-btn">GUEST</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
