<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Professional Experience - FurniConnect</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#e3c6d6] font-sans min-h-screen"> <!-- Changed to rose background -->

  <!-- Navbar -->
  <nav class="bg-white shadow p-4 flex justify-start items-center">
    <h1 class="text-xl font-bold text-gray-800 ml-4">
      Furni<span class="text-blue-600">Connect</span>
    </h1>
  </nav>

  <!-- Main Form Card -->
  <div class="flex justify-center py-8 px-4"> <!-- Changed mt-8 to py-8 for better spacing -->
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-lg"> <!-- Changed max-w-2xl to max-w-lg to match previous size -->

      <!-- Stepper -->
      <div class="flex justify-between items-center mb-6">
        <div class="flex items-center space-x-2 text-blue-600 font-medium">
          <div class="w-6 h-6 rounded-full bg-blue-600 text-white text-xs flex items-center justify-center">1</div>
          <span>Account</span>
        </div>
        <div class="border-t-2 border-blue-600 w-10"></div>
        <div class="flex items-center space-x-2 text-blue-600 font-medium">
          <div class="w-6 h-6 rounded-full bg-blue-600 text-white text-xs flex items-center justify-center">2</div>
          <span>Portfolio</span>
        </div>
        <div class="border-t-2 border-blue-600 w-10"></div>
        <div class="flex items-center space-x-2 text-gray-900 font-medium">
          <div class="w-6 h-6 rounded-full border-2 border-blue-600 text-blue-600 text-xs flex items-center justify-center">3</div>
          <span>Experience</span>
        </div>
      </div>

      <!-- Form Title -->
      <h2 class="text-xl font-semibold text-gray-800 mb-4">Professional Experience</h2>

      <!-- Form Fields -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="text-sm font-medium text-gray-700">Company Name</label>
          <input type="text" placeholder="e.g., Mohm Furniture"
            class="w-full mt-1 border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500"/>
        </div>
        <div>
          <label class="text-sm font-medium text-gray-700">Position</label>
          <input type="text" placeholder="e.g., Junior Furniture Designer"
            class="w-full mt-1 border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500"/>
        </div>
        <div>
          <label class="text-sm font-medium text-gray-700">Start Date</label>
          <input type="text" placeholder="D/M/YY"
            class="w-full mt-1 border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500"/>
        </div>
        <div>
          <label class="text-sm font-medium text-gray-700">End Date</label>
          <input type="text" placeholder="D/M/YY"
            class="w-full mt-1 border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500"/>
        </div>
      </div>

      <div class="mt-4">
        <label class="text-sm font-medium text-gray-700">Responsibilities & Achievements</label>
        <textarea rows="4" placeholder="Describe your key responsibilities and achievements..."
          class="w-full mt-1 border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      <!-- Add Experience -->
      <p class="mt-2 text-sm text-blue-600 cursor-pointer hover:underline">+ Add Another Experience</p>

      <!-- Skills -->
      <div class="mt-6">
        <h3 class="text-sm font-medium text-gray-700 mb-2">Skills</h3>
        <div class="flex flex-wrap gap-2 mb-2">
          <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm">Research</span>
          <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm">Technical Drawing</span>
          <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm">3D Modeling</span>
        </div>
        <button class="text-sm text-blue-600 hover:underline">+ Add Skills</button>
      </div>

      <!-- Languages -->
      <div class="mt-6">
        <h3 class="text-sm font-medium text-gray-700 mb-2">Languages</h3>
        <div class="flex items-center gap-4 mb-2">
          <span class="bg-gray-100 px-3 py-1 rounded-full text-sm">English</span>
          <select class="border rounded-md px-3 py-1 focus:ring-2 focus:ring-blue-500">
            <option disabled selected>Select proficiency</option>
            <option>Proficient</option>
            <option>Advanced</option>
            <option>Intermediate</option>
            <option>Basic</option>
          </select>
        </div>
        <button class="text-sm text-blue-600 hover:underline">+ Add Language</button>
      </div>

      <!-- Back Button -->
      <div class="mt-6 flex gap-4">
        <a href="Untitled-3.html"><button class="bg-gray-100 text-gray-600 px-6 py-2 rounded hover:bg-gray-200">Back</button></a>
        <div class="flex-grow"></div> <!-- Spacer -->
        <a href="Untitled-5.html"><button class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600">Continue</button></a>
      </div>
    </div>
  </div>
</body>
</html>
