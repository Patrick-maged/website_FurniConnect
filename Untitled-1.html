<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FurniConnect Login</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
    <div class="container">
        <!-- Left Section: Image with Logo and Tagline -->
        <div class="left-section">
            <img src="ima.jpeg" height="740" width="750">
            <div class="overlay">
                
                <div class="logo">
                    <h1>FurniConnect</h1>
                    <p>Connecting the furniture industry worldwide</p>
                </div>
            </div>
        </div>

        <!-- Right Section: Login Interface -->
        <div class="right-section">
            <div class="login-content">
                
                <h1>Welcome to FurniConnect</h1>
                <p>The first platform connecting key stakeholders in the furniture industry. Choose your account type to continue.</p>
                <button class="btn user-btn">
                    Sign in as User
                    <span class="subtitle">Access personalized recommendations</span>
                    <span class="arrow">→</span>
                </button>
                <button class="btn corp-btn">
                    Sign in as Corporation
                    <span class="subtitle">Manage your business profile</span>
                    <span class="arrow">→</span>
                </button>
                <p class="create-account">Don't have an account? <a href="Untitled-2.html">Create Account</a></p>
                <p class="terms">By continuing, you agree to our <a href="#">TERMS</a> & <a href="#">PRIVACY POLICY</a></p>
            </div>
        </div>
    </div>
</body>
</html>
