<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload - FurniConnect</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#e3c6d6] font-sans min-h-screen"> <!-- Rose background -->

  <!-- Navbar -->
  <nav class="bg-white shadow p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-gray-800">
      Furni<span class="text-blue-600">Connect</span>
    </h1>
  </nav>

  <!-- Form Section -->
  <div class="flex justify-center items-center py-10 px-4">
    <!-- White form container -->
    <div class="bg-white shadow-md rounded-lg p-8 w-full max-w-lg"> <!-- Changed to white -->
      <!-- Stepper -->
      <div class="flex justify-between items-center mb-6">
        <div class="flex items-center space-x-2 text-blue-600 font-medium">
          <div class="w-6 h-6 rounded-full bg-blue-600 text-white text-xs flex items-center justify-center">1</div>
          <span>Account</span>
        </div>
        <div class="border-t-2 border-blue-600 w-10"></div>
        <div class="flex items-center space-x-2 text-gray-900 font-medium">
          <div class="w-6 h-6 rounded-full border-2 border-blue-600 text-blue-600 text-xs flex items-center justify-center">2</div>
          <span>Portofolio</span>
        </div>
        <div class="border-t-2 border-blue-600 w-10"></div>
        <div class="flex items-center space-x-2 text-gray-900 font-medium">
          <div class="w-6 h-6 rounded-full border-2 border-blue-600 text-blue-600 text-xs flex items-center justify-center">3</div>
          <span>Experience</span>
        </div>
      </div>
      
      <h2 class="text-xl font-semibold mb-6 text-gray-800">Build your Profile</h2>

      <!-- Profile Image Upload -->
      <div class="flex items-center space-x-4 mb-6">
        <div class="w-12 h-12 bg-gray-200 rounded-full flex items-center justify-center text-gray-500">
          <span class="text-sm">👤</span>
        </div>
        <button class="text-sm text-blue-600 hover:underline">Upload Photo</button>
      </div>

      <!-- Professional Bio -->
      <label class="block text-sm font-medium text-gray-700 mb-1">Professional bio</label>
      <input type="text" placeholder="Tell us about your self"
        class="w-full border border-gray-300 rounded-lg px-4 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500" />

      <!-- Professional Links -->
      <label class="block text-sm font-medium text-gray-700 mb-1">Professional links</label>
      <input type="text" placeholder="insert your GitHub link"
        class="w-full border border-gray-300 rounded-lg px-4 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <input type="text" placeholder="insert your behance link"
        class="w-full border border-gray-300 rounded-lg px-4 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <input type="text" placeholder="insert Your linkedin link"
        class="w-full border border-gray-300 rounded-lg px-4 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500" />

      <!-- Upload Box -->
      <div
        class="w-full border-2 border-dashed border-gray-300 rounded-lg py-10 flex justify-center items-center text-gray-400 text-sm mb-6 cursor-pointer hover:border-blue-400 hover:text-blue-600 transition">
        Click to upload image
      </div>

      <!-- Submit Button -->
      <div class="mt-6 flex gap-4">
        <a href="Untitled-2.html"><button class="bg-gray-100 text-gray-600 px-6 py-2 rounded hover:bg-gray-200">Back</button></a>
        <div class="flex-grow"></div> <!-- Spacer -->
        <a href="Untitled-4.html"><button class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600">Continue</button></a>
      </div>
    </div>
  </div>
</body>
</html>
